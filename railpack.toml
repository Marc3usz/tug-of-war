[project]
name = "tug-of-war"
version = "1.0.0"

# Backend service
[[services]]
name = "backend"
type = "web"
dockerfile = "tug-of-war-backend/Dockerfile"
context = "tug-of-war-backend"

[services.port]
internal = 3000
external = 3000

[services.env]
NODE_ENV = "production"

[services.health_check]
path = "/"
interval = 30
timeout = 10
retries = 3

# Frontend service
[[services]]
name = "frontend"
type = "web"
dockerfile = "tug-of-war-frontend/Dockerfile"
context = "tug-of-war-frontend"

[services.port]
internal = 80
external = 80

[services.env]
NODE_ENV = "production"

[services.health_check]
path = "/"
interval = 30
timeout = 10
retries = 3

[services.depends_on]
backend = { condition = "healthy" }

# Build configuration
[build]
parallel = false

[[build.stages]]
name = "backend"
command = "docker build -t tug-of-war-backend ./tug-of-war-backend"

[[build.stages]]
name = "frontend"
command = "docker build -t tug-of-war-frontend ./tug-of-war-frontend"

# Network configuration
[network]
name = "tug-of-war-network"
driver = "bridge"
